[package]
name = "mosna-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The graphical Windows installer, shipped as INSTALLATION.exe"

[lib]
name = "mosna_setup"
path = "src/lib.rs"

[[bin]]
name = "mosna-setup"
path = "src/main.rs"

[dependencies]
eframe = "0.35"
egui = "0.35"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
rfd = "0.17"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
