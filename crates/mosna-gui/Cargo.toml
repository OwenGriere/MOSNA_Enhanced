[package]
name = "mosna-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Graphical interface of MOSNA"

[lib]
name = "mosna_gui"
path = "src/lib.rs"

[[bin]]
name = "mosna-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
regex.workspace = true
serde_yaml.workspace = true

mosna-config.workspace = true
# For the colour maps: the interactive network is coloured by the same tables
# as the figures, so a niche is the same colour in both.
mosna-core.workspace = true
mosna-io.workspace = true
mosna-paths.workspace = true

eframe = "0.35"
egui = "0.35"
# Two loaders, and both are needed to put a figure on the screen: `file` reads
# the bytes behind the `file://` URI the viewer builds, `image` decodes them.
# With only `image`, egui has nothing that answers for the scheme and reports
# "No matching BytesLoader" at the moment the user opens the Images tab.
egui_extras = { version = "0.35", features = ["image", "file"] }
# The decoder `egui_extras/image` calls, and the one the window icon is read
# with. `png` and `jpeg` are the formats the pipeline writes; `ico` is for the
# shipped logo, which may be a real icon file rather than the PNG it is today —
# the same three `mosna-install` accepts, so the two cannot disagree about what
# the logo is.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "ico",
] }
rfd = "0.17"

[dev-dependencies]
tempfile = "3"
