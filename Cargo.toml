[workspace]
resolver = "2"
members = [
    "crates/mosna-config",
    "crates/mosna-testkit",
    "crates/mosna-paths",
    "crates/mosna-install",
    "crates/mosna-io",
    "crates/mosna-core",
    "crates/mosna-xy",
    "crates/mosna-pipeline",
    "crates/mosna-cli",
    "crates/mosna-gui",
    "benchmark",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Owen GRIERE"]
description = "MOSNA GUI — Rust port of the spatial network construction and analysis toolchain"

[workspace.dependencies]
mosna-config = { path = "crates/mosna-config" }
mosna-testkit = { path = "crates/mosna-testkit" }
mosna-paths = { path = "crates/mosna-paths" }
mosna-io = { path = "crates/mosna-io" }
mosna-core = { path = "crates/mosna-core" }
mosna-xy = { path = "crates/mosna-xy" }
mosna-pipeline = { path = "crates/mosna-pipeline" }

anyhow = "1"
thiserror = "2"
rayon = "1"
ndarray = { version = "0.16", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
rand = "0.8"
rand_distr = "0.4"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
regex = "1"
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
