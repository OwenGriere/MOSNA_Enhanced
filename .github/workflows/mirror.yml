name: Push main to Vera Pancaldi Lab


on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier le secret
        env:
          KEY: ${{ secrets.TARGET_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "Secret VIDE ou introuvable"
          else
            echo "Secret présent (${#KEY} caractères)"
          fi

      - name: Configurer la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TARGET_DEPLOY_KEY }}

      - name: Ajouter github.com aux hôtes connus
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push to Vera Pancaldi Lab
        run: |
          git remote add target git@github.com:VeraPancaldiLab/MOSNA_GUI_Enhanced.git
          git push target main:main --force