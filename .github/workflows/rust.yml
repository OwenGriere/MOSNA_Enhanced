name: CI

# Every unit test of the Rust port runs here. A red build blocks the change:
# the port's contract is that each module ships with the tests that pin its
# behaviour against the Python implementation it replaces.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings so dead code and unused results cannot accumulate.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The application ships on Linux and Windows, so both are covered.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Unit and integration tests
        run: cargo test --workspace --all-features

      - name: Documentation tests
        run: cargo test --workspace --doc

  # Agreement with the implementation this port replaces, which is the one
  # thing every other job here does not check: they all ask whether the code is
  # consistent with itself. That gap is how a wrong Delaunay default and a
  # transposed set of column names reached the tree, both with a passing test
  # suite and a comment explaining they were harmless.
  #
  # Its own job, so a parity failure is legible at a glance rather than buried
  # among the unit tests.
  parity:
    name: parity with the reference implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compare against test/parity/reference.json
        run: cargo test -p mosna-pipeline --test parity -- --nocapture

  # Property-based tests explore far more inputs than the example-based ones.
  # `PROPTEST_CASES` is read by proptest itself, so the same test bodies run
  # with a much larger budget here than in a local `cargo test`.
  proptest:
    name: property tests (deep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run property tests with an enlarged case budget
        env:
          PROPTEST_CASES: '2048'
          # Fail rather than silently skip when shrinking takes too long.
          PROPTEST_MAX_SHRINK_ITERS: '10000'
        run: cargo test --workspace prop_ -- --nocapture

  # The bench's level 1 is a golden test: it recomputes the deterministic core
  # and compares it against the references committed under `benchmark/golden/`.
  # It exits non-zero on drift, which is only a guard rail if it is automatic.
  #
  # Release, because a golden reference recorded from an optimised build is what
  # it has to be checked against — and because a debug run of the same work
  # would take long enough to be worth skipping.
  bench:
    name: numerical drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The small cohort: under a second, and it exercises every deterministic
      # stage. The large reference is there for a deeper local check.
      - name: Level 1 — golden (small cohort)
        run: cargo run --release -p mosna-bench -- --samples 2 --cells 3000 golden

      # Level 2 needs no reference: it runs the seeded stages on one thread and
      # on many, and the two must agree. This is the check that caught Leiden
      # breaking ties by hash order.
      - name: Level 2 — reproducibility
        run: cargo run --release -p mosna-bench -- --samples 1 --cells 2000 reproduce

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `RUSTFLAGS` above covers rustc, not rustdoc — they are separate
      # variables, and the difference let a broken intra-doc link sit in the
      # tree unnoticed: the documentation promised an approximate k-NN fallback
      # that was never written.
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
